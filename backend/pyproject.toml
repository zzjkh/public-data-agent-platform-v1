[project]
name = "public-data-agent-backend"
version = "0.1.0"
description = "Backend for the public data agent platform."
requires-python = ">=3.12,<3.15"
dependencies = [
    "alembic>=1.14.0",
    "beautifulsoup4>=4.12.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "pdfplumber>=0.11.0",
    "psycopg[binary]>=3.2.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.4.0",
    "pymupdf>=1.25.0",
    "pytesseract>=0.3.13",
    "rapidocr>=3.8.3",
    "onnxruntime>=1.22.0",
    "pwdlib[argon2]>=0.2.0",
    "pyjwt>=2.10.0",
    "python-dotenv>=1.0.1",
    "python-multipart>=0.0.12",
    "sqlalchemy>=2.0.0",
    "sqlglot>=27.0.0",
    "structlog>=24.2.0",
    "uvicorn[standard]>=0.30.0",
    "openpyxl>=3.1.0",
]

[project.optional-dependencies]
embeddings = [
    "sentence-transformers>=3.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
