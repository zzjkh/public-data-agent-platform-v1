services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: public-data-agent-postgres
    environment:
      POSTGRES_DB: public_data_agent
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d public_data_agent"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
