[project]
name = "public-data-embedding-server"
version = "0.1.0"
description = "OpenAI-compatible embedding service for the public data agent platform."
requires-python = ">=3.10,<3.14"
dependencies = [
    "aiohttp>=3.10.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"
